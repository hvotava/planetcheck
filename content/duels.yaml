# ---------------------------------------------------------------------------
# COUNTRY DUELS (ARCHITECTURE §15 phase 5) — curated head-to-head pairs.
#
# A duel is only a lens on data that already exists: it compares two countries'
# answers in the live round. No duel is computed live for an arbitrary pair, so
# nobody can point the product at a pairing we did not choose.
#
# Rule for picking pairs: friendly rivalries and plain contrasts only — neighbours
# who tease each other, not countries in conflict. A duel must be something both
# sides would share.
#
# Codes are ISO-3166 alpha-2 and are validated against data/countries.json on load.
# ---------------------------------------------------------------------------
duels:
  - key: cz-sk
    a: CZ
    b: SK
    i18n:
      cs: { title: "Česko vs. Slovensko", blurb: "Rozdělili se v klidu. Souhlasí ale ještě v něčem?" }
      en: { title: "Czechia vs. Slovakia", blurb: "They split peacefully. Do they still agree on anything?" }

