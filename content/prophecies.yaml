# ---------------------------------------------------------------------------
# PROROCTVÍ / PROPHECIES (ARCHITECTURE §15 phase 5)
#
# A prophecy is a yes/no claim about the future. Players give a probability; when it
# resolves, every guess gets a Brier score, so "how well does the planet forecast?"
# becomes a number next to "how well does it survive?".
#
# Rules for writing one:
#   1. It must be settleable from a NAMED PUBLIC SOURCE, and the source belongs in the
#      blurb. A prophecy nobody can check is a rumour, which is what this game is against.
#   2. No elections, no conflicts, no claims about what a named state will decide.
#      Prophecies are about the physical world and about technology, not about politics.
#   3. `review_required: true` everywhere: these carry precise numbers, and an unreviewed
#      machine translation of a number is worse than English (see §11).
#   4. `outcome` is never set here. Resolution is an operator action through
#      POST /api/admin/prophecy, recorded with a public note.
#
# WORDING TO CONFIRM WITH HYNEK before the first prophecy closes — the mechanism is
# approved, these six claims are my drafts.
# ---------------------------------------------------------------------------
prophecies:
