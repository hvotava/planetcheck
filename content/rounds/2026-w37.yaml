# ---------------------------------------------------------------------------
# WEEKLY ROUND 2026-w37 — theme: "Sousedé" / "Neighbours"
#
# 7 dilemmas (4 anchors + 3 weekly) + 1 meta question ≈ 90 seconds.
# Exactly one honeypot per round (here: bigger_stick.control, via the anchor include).
# The meta question sits IMMEDIATELY BEFORE its target card: the player guesses first,
# answers the card, and only then sees the planet's distribution + how close the guess was.
#
# Deck design notes:
#   - not every card has 4 options (neighbor_field and the_sick_village have 3) so the
#     "pay / compromise / force / isolate" pattern is not the same on every card;
#   - secret_weapon has two compromise options with different costs (promise vs. alliance);
#   - the_sick_village raises the stakes beyond property disputes; rumor adds disinformation.
#   Questions taken out of this deck (the_bridge, the_harvest, bigger_stick.club) are parked
#   in content/bench.yaml for later rounds.
#
# DRAFT CONTENT — confirm with Hynek before going live (formulations + axis weights).
# No question names a real state → review_required stays false.
# ---------------------------------------------------------------------------
round:
  slug: 2026-w37
  kind: weekly
  status: live
  starts_at: 2026-09-01T06:00:00Z
  ends_at: 2026-09-13T22:00:00Z
  unlock_threshold: 500
  survival_weights: { consistency: 0.4, compromise: 0.35, realism: 0.25 }
  i18n:
    cs: { title: "Sousedé", blurb: "Týden o tom, co uděláš, když to, co chceš, má někdo vedle." }
    en: { title: "Neighbours", blurb: "A week about what you do when the thing you want belongs to the people next door." }

# Anchor questions copied from content/rounds/anchor.yaml (same keys → trend across rounds).
# Positions are explicit so the deck order is unambiguous (meta immediately before its target).
include_anchors:
  - { key: neighbor_field, position: 1 }
  - { key: stranger_at_door, position: 2 }
  - { key: bigger_stick, position: 3 }
  - { key: rumor, position: 7 }

questions:
  - key: the_referee
    type: choice
    position: 4
    i18n:
      cs: { scenario: "Dvě vesnice se hádají, kdo smí rybařit v jezeře.", text: "Kdo to má rozsoudit?" }
      en: { scenario: "Two villages argue over who may fish the lake.", text: "Who should settle it?" }
    options:
      - key: elder
        icon: "🎣"
        i18n: { cs: { text: "Nejstarší rybář, kterého znají všichni" }, en: { text: "The oldest fisherman, whom everyone knows" } }
        axis_weights: { trust_paranoia: -0.4, us_them: -0.2 }
        compromise: true
      - key: court
        icon: "🏛️"
        i18n: { cs: { text: "Soud v hlavním městě, i když to potrvá roky" }, en: { text: "The court in the capital, even if it takes years" } }
        axis_weights: { peace_force: -0.5, trust_paranoia: 0.2 }
        compromise: true
      - key: boats
        icon: "⛵"
        i18n: { cs: { text: "Ten, kdo má víc lodí" }, en: { text: "Whoever has more boats" } }
        axis_weights: { peace_force: 0.8, us_them: 0.5 }
      - key: lottery
        icon: "🎲"
        i18n: { cs: { text: "Losujeme. Rybám je to jedno." }, en: { text: "Draw lots. The fish don't care." } }
        axis_weights: { peace_force: -0.2, trust_paranoia: -0.2 }

  - key: secret_weapon_meta
    type: meta
    position: 5
    target: { question: secret_weapon, option: buy }
    i18n:
      cs: { scenario: "Další karta: soused má tajnou zbraň.", text: "Můžeš ji mít taky, za celou letošní úrodu. Kolik % planety ji koupí?" }
      en: { scenario: "Next card: your neighbour has a secret weapon.", text: "You can have one too, for this year's entire harvest. What % of the planet buys it?" }

  - key: secret_weapon
    type: choice
    position: 6
    i18n:
      cs: { scenario: "Soused má tajnou zbraň.", text: "Můžeš ji mít taky, ale stojí celou letošní úrodu." }
      en: { scenario: "Your neighbour has a secret weapon.", text: "You can have one too, but it costs this year's entire harvest." }
    options:
      - key: buy
        icon: "🛡️"
        i18n: { cs: { text: "Koupím. Bezpečí především." }, en: { text: "Buy it. Safety first." } }
        axis_weights: { peace_force: 0.8, trust_paranoia: 0.6 }
      # cheap compromise: costs nothing, rests on his word
      - key: promise
        icon: "🕊️"
        i18n: { cs: { text: "Nekoupím. Domluvím s ním, že ji nikdy nepoužije." }, en: { text: "Don't buy. Get him to promise he'll never use it." } }
        axis_weights: { peace_force: -0.8, trust_paranoia: -0.5 }
        compromise: true
      # expensive compromise: costs coordination with everyone else
      - key: alliance
        icon: "🏘️"
        i18n: { cs: { text: "Nekoupím, ale domluvím se s ostatními sousedy na společné obraně" }, en: { text: "Don't buy, but agree with the other neighbours on a shared defence" } }
        axis_weights: { peace_force: -0.2, us_them: -0.6 }
        compromise: true
      - key: half
        icon: "🎭"
        i18n: { cs: { text: "Koupím půlku a dělám, že mám celou" }, en: { text: "Buy half and pretend it's whole" } }
        axis_weights: { peace_force: 0.3, trust_paranoia: 0.3 }

  - key: the_sick_village
    type: choice
    position: 8
    i18n:
      cs: { scenario: "V sousední vesnici vypukla nemoc.", text: "Zatím nikdo neví, jak se šíří. Co uděláte?" }
      en: { scenario: "Disease has broken out in the next village.", text: "Nobody knows yet how it spreads. What do you do?" }
    options:
      - key: send_doctor
        icon: "🩺"
        i18n: { cs: { text: "Pošleme tam našeho doktora a léky" }, en: { text: "Send them our doctor and our medicine" } }
        axis_weights: { peace_force: -0.2, trust_paranoia: -0.5, us_them: -0.8 }
      - key: quarantine_help
        icon: "📦"
        i18n: { cs: { text: "Cestu zavřeme, ale jídlo a léky jim necháváme na hranici" }, en: { text: "Close the road, but leave food and medicine at the border" } }
        axis_weights: { trust_paranoia: 0.3, us_them: -0.2 }
        compromise: true
      - key: close_road
        icon: "🚧"
        i18n: { cs: { text: "Zavřeme cestu. Nikdo sem, nikdo tam, dokud to nepřejde." }, en: { text: "Close the road. Nobody in, nobody out, until it passes." } }
        axis_weights: { trust_paranoia: 0.8, us_them: 0.7 }
